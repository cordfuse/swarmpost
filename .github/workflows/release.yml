name: Release — swarmpost

# Push a v* tag to cut a GitHub Release + publish @cordfuse/swarmpost to npm.
on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'   # required for NODE_AUTH_TOKEN

      - name: Install deps
        run: npm install

      - name: Test
        run: npm test

      - name: Pack tarball
        run: npm pack

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: cordfuse-swarmpost-*.tgz            # npm pack flattens @cordfuse/swarmpost

      - name: Publish to npm
        if: ${{ env.NPM_TOKEN != '' }}                # no-op safely if the secret is absent
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
